<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kanban Board</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<h1 class="title">Kanban Task Board</h1>

<div class="header">
  <button id="addTaskBtn">Add New Task</button>
</div>

<div class="columns">
  <div class="column" id="todo-column">
    <h2>TO DO</h2>
    <!-- Tasks will appear here -->
  </div>
  <div class="column" id="doing-column">
    <h2>DOING</h2>
    <!-- Tasks will appear here -->
  </div>
  <div class="column" id="done-column">
    <h2>DONE</h2>
    <!-- Tasks will appear here -->
  </div>
</div>

<!-- Modal for viewing/editing task -->
<div id="taskModal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-content">
    <button id="closeModal" class="close-btn">&times;</button>
    <h2>Edit Task</h2>
    <label>Title</label>
    <input type="text" id="taskTitle" />
    <label>Description</label>
    <textarea id="taskDescription"></textarea>
    <label>Status</label>
    <select id="taskStatus">
      <option value="To Do">To Do</option>
      <option value="In Progress">In Progress</option>
      <option value="Done">Done</option>
    </select>
    <button id="saveTask" class="save-btn">Save</button>
  </div>
</div>
<script src="initialData.js"></script>
<script src="script.js"></script>
</body>
</html>
